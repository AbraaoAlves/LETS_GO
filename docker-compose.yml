services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bind to localhost by default; the default creds make this a local-only
      # TDD stack. Override POSTGRES_BIND_ADDRESS to expose it deliberately.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 4s
      timeout: 4s
      retries: 5

  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://postgres:5432/lab -user=postgres -password=postgres -connectRetries=60 -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  pipeline_tester:
    image: postgres:15
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      DB_URL: postgresql://postgres:postgres@postgres:5432/lab
    command: ["bash", "tests/run_pipeline.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
